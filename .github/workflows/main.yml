          '@
          $zip = Join-Path $env:RUNNER_TEMP "techdecode-desktop.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($payload))
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne "46797ae3928a7fb6e365f158f264208b41917e8f4e955b9ae025e452233f10a0") { throw "Bundled desktop checksum mismatch." }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          Remove-Item $zip -Force
      - name: Validate settings and scripts
        env:
          MINUTES: ${{ inputs.session_minutes }}
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RD_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          $minutes = 0
          if (-not [int]::TryParse($env:MINUTES, [ref]$minutes) -or $minutes -lt 15 -or $minutes -gt 300) {
            throw 'Session duration must be an integer from 15 to 300.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TS_KEY)) { throw 'Add TAILSCALE_AUTH_KEY to repository secrets.' }
          if ($env:RD_PASSWORD.Length -lt 12 -or $env:RD_PASSWORD -match '[\r\n]') { throw 'Add RUSTDESK_PASSWORD: at least 12 characters, no line breaks.' }
          Get-ChildItem scripts,desktop -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install desktop experience
        timeout-minutes: 8
        run: .\scripts\Install-Desktop.ps1
      - name: Connect Tailscale and RustDesk
        timeout-minutes: 20
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RD_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\Setup-Remote.ps1
      - name: Session - connect now
        env:
          MINUTES: ${{ inputs.session_minutes }}
        run: |
          Write-Host 'TECH Decode Cloud PC'
          Write-Host "RustDesk direct address: $env:TAILSCALE_IP`:21118"
          Write-Host 'Use the password stored in RUSTDESK_PASSWORD.'
          Write-Host 'Open TECH Decode Launcher on the remote desktop.'
          $end = (Get-Date).AddMinutes([int]$env:MINUTES)
          while ((Get-Date) -lt $end) {
            $remaining = [math]::Ceiling(($end - (Get-Date)).TotalMinutes)
            Write-Host "Session remaining: $remaining minutes. Download your files before the session ends."
            Start-Sleep -Seconds ([math]::Min(60, [math]::Max(1, ($end - (Get-Date)).TotalSeconds)))
          }
      - name: Disconnect and clean up
        if: always()
        run: |
          Stop-Service RustDesk -Force -ErrorAction SilentlyContinue
          $ts = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (Test-Path $ts) { & $ts logout }
          Unregister-ScheduledTask -TaskName TechDecodeWelcome -Confirm:$false -ErrorAction SilentlyContinue
          Write-Host 'Session ended. The hosted runner and its files are temporary.'
          exit 0
